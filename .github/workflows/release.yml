# 推送 v* tag 时构建 Windows 安装包、签名，发布到 GitHub Releases。
# Release 里的 latest.json 就是应用内自动更新读取的清单。
#
# 需要的仓库 Secret：
#   TAURI_SIGNING_PRIVATE_KEY  更新签名私钥（本机 ~/.tauri/fukidashi.key 的内容）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # 钩子核心不进仓库，按 VERSION 记录的版本从 LunaTranslator 发布包里取
      - run: pnpm lunahook:fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Fukidashi ${{ github.ref_name }}
          releaseBody: 下载并运行 `Fukidashi_*_x64-setup.exe`。已安装旧版本的用户会在应用内收到更新提示。
          releaseDraft: false
          prerelease: false
